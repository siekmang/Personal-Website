<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        let theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (err) {
          theme = null;
        }
        if (!theme) {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body load="getPics()">
    <div class="content" id="port-html">
      <img src="img/socialpic.webp" alt="Picture of Greg Siekman on the other side of a screen, looking into the distance holding his brown tabby cat Chauncey who is doing the same." id="id_photo" />

      <div class="main-box" id="home-main-box" role="main">
        <div id="nametag" role="banner"></div>
        <div id="portfolio">
          <h2>AUDIO</h2>
          <div id="audio-portfolio" class="portfolio-section">
            <!--Supertonic, GLEP-->
            <div class="audio-portfolio-item">

                ><img
                  src="img/portfolio/GreenLightEPcover.webp"
                  alt="Image of red taillights driving past a green light at an intersection. The album cover for The Green Light EP by Supertonic."
                  class="audio-portfolio-images portfolio-images"
                />
                <p>The Green Light EP - Supertonic</p></a
              >

            <!--Supertonic, Homebody-->

    <br />

    <script type="module" src="src/main.js"></script>
  </body>
</html>
