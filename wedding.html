<body>
  <div id="info-box">
    <h1>Gabrielle Jackson & Greg Siekman</h1>
    <h2>Wedding Celebration</h2>
    <div class="button-row">
      <!--<a href="#rsvp-form" role="button">RSVP</a>-->
      <button onclick="window.open('https://www.zola.com/registry/gabrielleandgreg2026', '_blank')">Registry</button>
    </div>
    <p>
      We're getting married on June 27th in a small family ceremony. To celebrate with all of our friends and loved
      ones, we'd love for you to join us for food and festivities on July 26th 11am-2pm at Lost Valley in Auburn.
    </p>
    <h2 id="rsvp-header">RSVP</h2>
    <form id="rsvp-form">
      <fieldset>
        <label>
          Name
          <input name="Name" placeholder="Name" autocomplete="given-name" required />
        </label>
        <fieldset>
          <legend id="Attending">Attending?</legend>
          <input type="radio" id="yes" value="yes" name="attending" checked />
          <label for="yes">Yes</label>
          <input type="radio" id="no" value="no" name="attending" />
          <label for="no">No</label>
        </fieldset>
        <label>
          Number of people
          <input type="text" inputmode="numeric" pattern="[0-9]*" name="People" placeholder="0" required />
        </label>
      </fieldset>

      <p id="status"></p>
      <input type="submit" value="Submit" />
    </form>
  </div>

  <script>
    document.getElementById("rsvp-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const form = e.target;
      const status = document.getElementById("status");

      const payload = {
        Name: form.elements["Name"].value,
        Attending: form.elements["attending"].value,
        People: form.elements["People"].value,
      };

      const res = await fetch("https://sheetdb.io/api/v1/p9r9iw96012wk", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: [payload] }),
      });

      if (!res.ok) {
        status.textContent = "Something went wrong — please email us at greg@siekmang.com";
        return;
      }

      status.textContent = "Thank you! We'll see you there.";
      form.reset();
    });
  </script>
</body>
