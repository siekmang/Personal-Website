<!doctype html>
<!--TODO; I want to add current media and favorite media pages at some point-->
<html lang="en">
  <head>
    <script>
      (function () {
        let theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (err) {
          theme = null;
        }
        if (!theme) {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="content">

          <p>Drop me an <a href="mailto:webmaster@siekmang.com">email</a>! Let's talk music, baseball, video games, the web beyond social media, or just let me know how you ended up here!</p>
        </div>

        <div id="social-menu">
          <ul>
            <li>
              <a href="mailto:webmaster@siekmang.com" target="_blank" rel="noopener noreferrer me"
                ><img
                  src="img/mail_icon.webp"
                  alt="Mail icon linking to Greg's contact email address webmaster@siekmang.com"
                  title="Email me!"

            </li>

    <div id="dark-switch-hover"></div>

    <script>

</html>
